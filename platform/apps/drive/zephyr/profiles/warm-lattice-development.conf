# Explicit unmeasured development model; no physical or route64 admission.
CONFIG_XENOVA_DRIVE_WARM=y
CONFIG_XENOVA_DRIVE_LATTICE=y
CONFIG_PICOLIBC=y
CONFIG_XENOVA_DRIVE_AUTO_PRIORITY=7
CONFIG_XENOVA_DRIVE_RECORDER=n
CONFIG_XENOVA_DIAGNOSTICS_THREADS=y
CONFIG_XENOVA_DIAGNOSTICS_MAX_THREADS=32
CONFIG_NET_MAX_CONN=7
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=32768
CONFIG_NET_PKT_RX_COUNT=96
CONFIG_NET_BUF_RX_COUNT=512
CONFIG_XENOVA_MQTT_TCP_NODELAY=y
# Static call-graph peaks (2026-11-15, -fcallgraph-info=su, excluding libc/exception
# frames): MANUAL 9248 B, AUTO 8448 B. 8 KiB overflowed into the adjacent stack.
CONFIG_XENOVA_DRIVE_WORKER_STACK_SIZE=16384
