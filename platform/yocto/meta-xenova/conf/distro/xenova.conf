# 고정된 Poky 정책을 계승하고 사용자에게 보이는 배포판 신원을 정의한다.
require conf/distro/poky.conf

DISTRO = "xenova"
DISTRO_NAME = "Xenova"

# 기존 :poky 정책·파일 선택을 유지하며 Xenova 전용 설정을 뒤에 적용한다.
DISTROOVERRIDES = "poky:${DISTRO}"

# 버전·codename·컴파일/SDK vendor는 고정된 Poky 설정을 그대로 사용한다.
# OS의 기반 계보와 기존 CPE 매칭도 보존한다.
ID_LIKE:pn-os-release = "poky"
CPE_DISTRO:pn-os-release = "poky"
